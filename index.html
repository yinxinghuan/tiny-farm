    function pickRoamTarget() {
      const candidates = [];
      const block = new Set(['water', 'house', 'tree', 'well', 'lantern', 'fence']);
      for (let x = 0; x < GRID; x++) {
        for (let z = 0; z < GRID; z++) {
          const c = gs.cells[cellKey(x, z)];
          if (c && block.has(c.kind)) continue;
          candidates.push({ x, z });
        }
      }
      if (!candidates.length) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function spawnAnimal(meshLegs, x, z, opts) {
      const { mesh, legs } = meshLegs;
      mesh.position.set(worldX(x), 0.36, worldZ(z));
      scene.add(mesh);
      return {
        mesh, legs,
        speedMs: opts.speedMs,
        stepRate: opts.stepRate,
        bodyY: 0.36,
        src: { x: mesh.position.x, z: mesh.position.z },
        dst: null,
        progress: 1,
        pauseUntil: 0,
        facing: 0,
      };
    }

    const animals = [
      spawnAnimal(makeCowMesh(),     2, 5, { speedMs: 2800, stepRate: 130 }),
      spawnAnimal(makeSheepMesh(),   6, 2, { speedMs: 3400, stepRate: 110 }),
      spawnAnimal(makeChickenMesh(), 5, 6, { speedMs: 1600, stepRate: 70  }),
    ];

    function updateAnimal(a, now, dt) {
      if (a.progress >= 1) {
        if (now < a.pauseUntil) {
          a.mesh.position.y = a.bodyY + Math.sin(now / 800) * 0.01;
          return;
        }
        const t = pickRoamTarget();
        if (!t) { a.pauseUntil = now + 2000; return; }
        a.src = { x: a.mesh.position.x, z: a.mesh.position.z };
        a.dst = { x: worldX(t.x), z: worldZ(t.z) };
        a.progress = 0;
        a.pauseUntil = 0;
      }
      a.progress = Math.min(1, a.progress + dt / a.speedMs);
      const e = a.progress;
      a.mesh.position.x = a.src.x + (a.dst.x - a.src.x) * e;
      a.mesh.position.z = a.src.z + (a.dst.z - a.src.z) * e;
      const dx = a.dst.x - a.src.x;
      const dz = a.dst.z - a.src.z;
      if (Math.hypot(dx, dz) > 0.001) {
        const want = Math.atan2(dx, dz) - Math.PI / 2;
        let diff = want - a.facing;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        a.facing += diff * Math.min(1, dt / 200);
        a.mesh.rotation.y = a.facing;
      }
      const stepT = now / a.stepRate;
      a.legs.forEach((leg, i) => {
        const phase = (i === 0 || i === 3) ? 0 : Math.PI;
        leg.position.y = (leg.userData.baseY || 0.08) + Math.max(0, Math.sin(stepT + phase)) * 0.05;
      });
      a.mesh.position.y = a.bodyY + Math.abs(Math.sin(stepT * 2)) * 0.02;
      if (a.progress >= 1) {
        a.pauseUntil = now + 800 + Math.random() * 1800;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // CAMERA / RESIZE
    // ─────────────────────────────────────────────────────────────
    function resize() {
      const W = window.innerWidth, H = window.innerHeight;
      renderer.setSize(W, H, false);
      const aspect = W / H;
      const viewH = 5.6;
      const viewW = viewH * aspect;
      cam.left = -viewW;
      cam.right = viewW;
      cam.top = viewH;
      cam.bottom = -viewH;
      cam.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ─────────────────────────────────────────────────────────────
    // RENDER LOOP
    // ─────────────────────────────────────────────────────────────
    let lastDraw = 0;
    let lastTime = performance.now();
    const FRAME_MS = 1000 / 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (now - lastDraw < FRAME_MS - 1) return;
      const dt = now - lastTime;
      lastTime = now;
      lastDraw = now;

      const swayT = now / 1500;
      for (const k in cellMeshes) {
        const cm = cellMeshes[k];
        const sp = cm.sprite;
        if (sp && sp.userData.dropAt) {
          const t = (now - sp.userData.dropAt) / 320;
          if (t >= 1) {
            sp.position.y = 0.36;
            sp.userData.dropAt = 0;
            sp.scale.setScalar(1);
          } else {
            const e = 1 - Math.pow(1 - t, 3);
            sp.position.y = 0.36 + (1 - e) * sp.userData.dropFrom;
            sp.scale.setScalar(0.7 + 0.3 * e);
          }
        }
        if (sp && sp.userData.swayAmount && !sp.userData.dropAt) {
          sp.rotation.z = Math.sin(swayT + (sp.userData.swayPhase || 0)) * sp.userData.swayAmount;
        }
        if (cm.decoration && cm.decoration.visible) {
          cm.decoration.rotation.z =
            Math.sin(swayT + cm.decoration.userData.swayPhase) * cm.decoration.userData.swayAmount;
        }
        // smoke (any placed house sprite)
        if (sp && sp.userData.smokes && tickStarted) {
          const ch = sp.userData.chimney;
          const sm = sp.userData.smokes;
          for (const puff of sm) {
            const tt = ((now / 2400) + puff.userData.t0) % 1;
            puff.position.x = ch.x + Math.sin(tt * 6 + (puff.userData.t0 * 6)) * 0.08;
            puff.position.y = ch.y + tt * 0.7;
            puff.position.z = ch.z - tt * 0.04;
            puff.material.opacity = (1 - tt) * 0.7;
            puff.scale.setScalar(0.5 + tt * 0.9);
          }
        }
      }

      if (tickStarted) {
        for (const a of animals) updateAnimal(a, now, dt);
      }

      // Time-of-day: advance only in auto mode (manual modes stay frozen)
      const todElapsedMs = now - lastTodAdvance;
      lastTodAdvance = now;
      if (weatherMode === 'auto') {
        todMinutes = (todMinutes + (todElapsedMs / TOD_CYCLE_MS) * 1440) % 1440;
      }
      applyTod();

      // Clouds drift; wrap around
      for (const c of clouds) {
        c.position.x += c.userData.driftSpeed * dt / 1000;
        if (c.position.x > CLOUD_RANGE) {
          c.position.x = -CLOUD_RANGE - Math.random() * 4;
          c.position.z = (Math.random() - 0.5) * CLOUD_RANGE;
        }
      }

      // Camera orbit (drag-driven) + tiny ambient bob
      const yaw = camYaw + Math.sin(now / 6000) * 0.003;
      cam.position.x = Math.sin(yaw) * CAM_DIST;
      cam.position.z = Math.cos(yaw) * CAM_DIST;
      cam.position.y = CAM_HEIGHT + Math.sin(now / 4500) * 0.08;
      cam.lookAt(0, 0, 0);

      renderer.render(scene, cam);
    }
    requestAnimationFrame(frame);

    // ─────────────────────────────────────────────────────────────
    // AUDIO (lazy, swell ambient)
    // ─────────────────────────────────────────────────────────────
    let actx = null;
    let masterGain = null;
    let ambientStarted = false;

    function ensureAudio() {
      if (actx) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = 0.55;
        masterGain.connect(actx.destination);
      } catch { actx = null; }
    }
    function startAmbient() {
      if (ambientStarted || !actx) return;
      ambientStarted = true;
      scheduleSwell();
      scheduleAnimalCall();
    }

    // ─────────────────────────────────────────────────────────────
    // ANIMAL CALLS — bird / cow / sheep / chicken / owl
    // Sparse, stereo-panned, time-of-day weighted. Sits underneath
    // the swell pad and the SFX bus.
    // ─────────────────────────────────────────────────────────────
    function timeOfDayPhase() {
      const h = (todMinutes / 60) % 24;
      if (h >= 4 && h < 7)  return 'dawn';
      if (h >= 7 && h < 18) return 'day';
      if (h >= 18 && h < 21) return 'dusk';
      return 'night';
    }
    const ANIMAL_WEIGHTS = {
      dawn:  { bird: 7, cow: 1, sheep: 1, chicken: 1, owl: 0 },
      day:   { bird: 4, cow: 3, sheep: 3, chicken: 2, owl: 0 },
      dusk:  { bird: 3, cow: 2, sheep: 2, chicken: 1, owl: 1 },
      night: { bird: 1, cow: 0, sheep: 0, chicken: 0, owl: 3 },
    };
    function pickAnimal() {
      const w = ANIMAL_WEIGHTS[timeOfDayPhase()];
      const total = Object.values(w).reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (const k of Object.keys(w)) {
        r -= w[k];
        if (r < 0) return k;
      }
      return 'bird';
    }

    function makeAnimalBus() {
      const ctx = actx;
      const pan = (typeof ctx.createStereoPanner === 'function')
        ? ctx.createStereoPanner() : null;
      const gain = ctx.createGain();
      gain.gain.value = 1;
      if (pan) {
        pan.pan.value = (Math.random() * 1.4) - 0.7;
        gain.connect(pan); pan.connect(masterGain);
      } else {
        gain.connect(masterGain);
      }
      return gain;
    }

    function animalNoiseBuf(seconds, shape) {
      const sr = actx.sampleRate;
      const len = Math.max(1, Math.floor(sr * seconds));
      const buf = actx.createBuffer(1, len, sr);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        let v = Math.random() * 2 - 1;
        if (shape) v *= shape(i / len);
        d[i] = v;
      }
      return buf;
    }

    function playBird(busOverride) {
      // 2–4 quick chirps, each a fast pitch glide ~2.5–4.5kHz
      const ctx = actx;
      const bus = busOverride || makeAnimalBus();
      const chirps = 2 + Math.floor(Math.random() * 3);
      const pitchHi = 3500 + Math.random() * 1500;
      const pitchLo = pitchHi - (700 + Math.random() * 800);
      let t = ctx.currentTime + 0.02;
      for (let i = 0; i < chirps; i++) {
        const o = ctx.createOscillator();
        o.type = 'sine';
        const g = ctx.createGain();
        const dur = 0.06 + Math.random() * 0.05;
        o.frequency.setValueAtTime(pitchLo, t);
        o.frequency.exponentialRampToValueAtTime(pitchHi, t + dur * 0.5);
        o.frequency.exponentialRampToValueAtTime(pitchLo * 0.9, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(bus);
        o.start(t); o.stop(t + dur + 0.02);
        t += dur + 0.05 + Math.random() * 0.08;
      }
    }

    function playCow() {
      // Low moo — sawtooth 80→55Hz, ~0.7s, dark formants
      const ctx = actx;
      const bus = makeAnimalBus();
      const t = ctx.currentTime + 0.02;
      const dur = 0.7 + Math.random() * 0.25;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(85, t);
      o.frequency.exponentialRampToValueAtTime(60, t + dur * 0.7);
      o.frequency.exponentialRampToValueAtTime(55, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.18, t + dur * 0.65);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const fA = ctx.createBiquadFilter();
      fA.type = 'bandpass'; fA.frequency.value = 320; fA.Q.value = 4;
      const fB = ctx.createBiquadFilter();
      fB.type = 'bandpass'; fB.frequency.value = 850; fB.Q.value = 5;
      const mix = ctx.createGain(); mix.gain.value = 1;
      o.connect(fA); o.connect(fB);
      fA.connect(mix); fB.connect(mix);
      mix.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function playSheep() {
      // Bleat — sawtooth ~270Hz with 18Hz tremolo (the "baa-a-a"),
      // bright mid formants, ~0.55s
      const ctx = actx;
      const bus = makeAnimalBus();
      const t = ctx.currentTime + 0.02;
      const dur = 0.5 + Math.random() * 0.2;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(280 + Math.random() * 40, t);
      o.frequency.exponentialRampToValueAtTime(240, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      // tremolo
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 16 + Math.random() * 6;
      const lfoG = ctx.createGain();
      lfoG.gain.value = 0.08;
      lfo.connect(lfoG); lfoG.connect(g.gain);
      const fA = ctx.createBiquadFilter();
      fA.type = 'bandpass'; fA.frequency.value = 750; fA.Q.value = 6;
      const fB = ctx.createBiquadFilter();
      fB.type = 'bandpass'; fB.frequency.value = 1700; fB.Q.value = 6;
      const mix = ctx.createGain(); mix.gain.value = 1;
      o.connect(fA); o.connect(fB);
      fA.connect(mix); fB.connect(mix);
      mix.connect(g); g.connect(bus);
      lfo.start(t); o.start(t);
      lfo.stop(t + dur + 0.05); o.stop(t + dur + 0.05);
    }

    function playChicken() {
      // 2–3 short clucks: noise burst + small 220Hz tone, ~60ms each
      const ctx = actx;
      const bus = makeAnimalBus();
      const clucks = 2 + Math.floor(Math.random() * 2);
      let t = ctx.currentTime + 0.02;
      for (let i = 0; i < clucks; i++) {
        const dur = 0.06;
        const src = ctx.createBufferSource();
        src.buffer = animalNoiseBuf(dur, x => Math.exp(-x * 8));
        const f = ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 3;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f); f.connect(g); g.connect(bus);
        src.start(t);
        // accompanying low tone
        const o = ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.value = 200 + Math.random() * 40;
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.08, t);
        og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(og); og.connect(bus);
        o.start(t); o.stop(t + dur + 0.02);
        t += 0.13 + Math.random() * 0.08;
      }
    }

    function playOwl() {
      // Two-tone hoo-hoo, low and round
      const ctx = actx;
      const bus = makeAnimalBus();
      const t0 = ctx.currentTime + 0.02;
      function hoot(at) {
        const dur = 0.32;
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(330, at);
        o.frequency.exponentialRampToValueAtTime(300, at + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.16, at + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        // soft body via 2nd partial
        const o2 = ctx.createOscillator();
        o2.type = 'sine';
        o2.frequency.value = 660;
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.04, at);
        g2.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(g); o2.connect(g2);
        g.connect(bus); g2.connect(bus);
        o.start(at); o.stop(at + dur + 0.02);
        o2.start(at); o2.stop(at + dur + 0.02);
      }
      hoot(t0);
      hoot(t0 + 0.55);
    }

    const ANIMAL_FN = {
      bird: playBird, cow: playCow, sheep: playSheep,
      chicken: playChicken, owl: playOwl,
    };

    function scheduleAnimalCall() {
      if (!actx) return;
      const delay = 4 + Math.random() * 10; // 4-14s between calls
      setTimeout(() => {
        if (!actx || actx.state !== 'running') {
          scheduleAnimalCall();
          return;
        }
        const kind = pickAnimal();
        try { ANIMAL_FN[kind](); } catch {}
        scheduleAnimalCall();
      }, delay * 1000);
    }
    function scheduleSwell() {
      if (!actx) return;
      const ctx = actx;
      const rise = 5 + Math.random() * 3;
      const hold = 8 + Math.random() * 8;
      const fall = 6 + Math.random() * 4;
      const silence = 7 + Math.random() * 9;
      const total = rise + hold + fall;
      const gain = ctx.createGain();
      gain.gain.value = 0;
      gain.connect(masterGain);
      const o1 = ctx.createOscillator();
      const o2 = ctx.createOscillator();
      o1.type = 'sine'; o2.type = 'sine';
      const roots = [130.81, 146.83, 164.81, 174.61, 196.0];
      const base = roots[Math.floor(Math.random() * roots.length)];
      o1.frequency.value = base;
      o2.frequency.value = base * 1.5 * (1 + (Math.random() - 0.5) * 0.005);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 800;
      o1.connect(lp); o2.connect(lp); lp.connect(gain);
      const t0 = ctx.currentTime;
      const peak = 0.16 + Math.random() * 0.05;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(peak, t0 + rise);
      gain.gain.setValueAtTime(peak, t0 + rise + hold);
      gain.gain.linearRampToValueAtTime(0, t0 + total);
      o1.start(t0); o2.start(t0);
      o1.stop(t0 + total + 0.05); o2.stop(t0 + total + 0.05);
      setTimeout(scheduleSwell, (total + silence) * 1000);
    }
    function playSfx(kind) {
      if (!actx || actx.state !== 'running') return;
      const ctx = actx;
      const t = ctx.currentTime;
      if (kind === 'place') {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(420, t);
        o.frequency.exponentialRampToValueAtTime(220, t + 0.18);
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + 0.24);
      } else if (kind === 'bonk') {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 110;
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        o.connect(g); g.connect(masterGain);
        o.start(t); o.stop(t + 0.13);
      }
    }

    function kickStart() {
      if (started) return;
      started = true;
      ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      setTimeout(() => { if (actx && actx.state === 'running') startAmbient(); }, 700);
      tickStarted = true;
    }

    // ─────────────────────────────────────────────────────────────
    // SAVE / LOAD
    // ─────────────────────────────────────────────────────────────
    function saveSoon() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => { saveTimer = null; writeSave(); }, 400);
    }
    function writeSave() {
      try {
        const data = { cells: {} };
        for (const k in gs.cells) {
          const c = gs.cells[k];
          data.cells[k] = { kind: c.kind, level: c.level, seed: c.seed };
        }
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch {}
    }
    function eraseSave() {
      try { localStorage.removeItem(SAVE_KEY); } catch {}
    }
    function readSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return data;
      } catch { return null; }
    }
    function applySave(data) {
      // Clear the default-init centerpiece before applying user's saved layout
      const all = Object.keys(gs.cells);
      for (const k of all) {
        const [x, z] = k.split(',').map(Number);
        delete gs.cells[k];
        setSprite(x, z, null);
      }
      for (const k in (data.cells || {})) {
        const sc = data.cells[k];
        const [x, z] = k.split(',').map(Number);
        gs.cells[k] = { kind: sc.kind, level: sc.level || 1, seed: sc.seed || 0 };
        setSprite(x, z, makeSprite(sc.kind, sc.level || 1, sc.seed || 0));
      }
    }

    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') writeSave();
    });
    window.addEventListener('pagehide', writeSave);

    // ─────────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────────
    (function init() {
      const resumeIco = document.getElementById('resume-ico');
      if (resumeIco) resumeIco.innerHTML = ICONS.tree;

      const shuffleBtn = document.getElementById('shuffle');
      if (shuffleBtn) {
        shuffleBtn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          kickStart();
          hideHint();
          shuffleBtn.classList.remove('spin');
          // Force reflow so the animation restarts on rapid taps
          void shuffleBtn.offsetWidth;
          shuffleBtn.classList.add('spin');
          randomFarm();
        });
      }

      // Default scene: one little red cottage in the middle
      placeInitialHomestead();
      const saved = readSave();
      const hasMeaningful = saved && Object.keys(saved.cells || {}).length > 0;
      renderDock();
      if (hasMeaningful) {
        const overlay = document.getElementById('resume-overlay');
        const total = Object.keys(saved.cells || {}).length;
        document.getElementById('resume-sub').textContent = `${total} tiles placed`;
        overlay.classList.add('show');
        document.getElementById('resume-yes').addEventListener('pointerdown', () => {
          applySave(saved);
          overlay.classList.remove('show');
        }, { once: true });
        document.getElementById('resume-no').addEventListener('pointerdown', () => {
          eraseSave();
          overlay.classList.remove('show');
        }, { once: true });
      }
    })();

  })();
  </script>
</body>
