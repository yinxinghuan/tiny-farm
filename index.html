<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="game-uuid" content="36bdcfe0-87b0-4288-9a72-fd8a26b42998" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Farm</title>
<style>
  :root {
    color-scheme: light;
    --sky: #f4ede0;
    --ink: #3a2f1e;
    --ink-soft: #6b6155;
    --ink-mute: #968d80;
    /* These three are remixed by JS each frame based on time-of-day —
       more opaque at night so the controls stay legible on a dark sky. */
    --chip-bg: rgba(255, 250, 245, 0.78);
    --chip-bg-hot: rgba(255, 255, 255, 0.95);
    --chip-border: rgba(255, 255, 255, 0.7);
    --chip-shadow:
      0 1px 0 rgba(255, 255, 255, 0.85) inset,
      0 -1px 0 rgba(120, 130, 150, 0.1) inset,
      0 1px 2px rgba(20, 30, 50, 0.05),
      0 12px 36px -12px rgba(40, 50, 80, 0.30);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--sky);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body {
    position: relative;
  }
  canvas#canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    touch-action: none;
  }

  /* Top-left hint */
  #hint {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    z-index: 20;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    max-width: 60vw;
    pointer-events: none;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--chip-shadow);
    transition: opacity 0.5s ease;
  }
  #hint.hide { opacity: 0; }

  /* Dock */
  #dock-wrap {
    position: absolute;
    left: 0; right: 0;
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
    z-index: 25;
    display: flex; justify-content: center;
    padding: 0 12px;
    pointer-events: none;
  }
  #dock {
    display: grid;
    grid-template-columns: repeat(6, 48px);
    gap: 2px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 24px;
    padding: 6px;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--chip-shadow);
    pointer-events: auto;
    touch-action: none;
  }
  .tool {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border-radius: 18px;
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    transition: background 0.16s ease, transform 0.08s ease;
    position: relative;
  }
  .tool .glyph {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);  /* default ink for currentColor icons */
    transition: color 0.16s ease;
  }
  .tool .glyph svg { width: 100%; height: 100%; display: block; }
  .tool .lbl {
    font-size: 8px;
    font-weight: 700;
    color: var(--ink-mute);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
    transition: color 0.16s ease;
  }
  .tool:active { transform: scale(0.94); }
  .tool.selected {
    background: var(--chip-bg-hot);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.9) inset,
      0 1px 2px rgba(20, 30, 50, 0.05);
  }
  .tool.selected .glyph { color: var(--ink); }
  .tool.selected .lbl { color: var(--ink); }

  /* Per-tool accent on the glyph (subtle, muted palette) */
  .tool[data-tool="tree"]      .glyph { color: #4a7a3a; }
  .tool[data-tool="bush"]      .glyph { color: #5e8a3e; }
  .tool[data-tool="flower"]    .glyph { color: #b85a72; }
  .tool[data-tool="wheat"]     .glyph { color: #c2952e; }
  .tool[data-tool="sunflower"] .glyph { color: #d8a32a; }
  .tool[data-tool="pumpkin"]   .glyph { color: #c8682a; }
  .tool[data-tool="house"]     .glyph { color: #6a7a96; }
  .tool[data-tool="fence"]     .glyph { color: #8a6a4a; }
  .tool[data-tool="well"]      .glyph { color: #7c7568; }
  .tool[data-tool="lantern"]   .glyph { color: #9a8242; }
  .tool[data-tool="water"]     .glyph { color: #4a90b8; }
  .tool[data-tool="erase"]     .glyph { color: #8a6a4a; }
  .tool.selected .glyph { filter: brightness(0.78); }

  /* Weather picker (top-right) */
  #weather {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 20;
    display: flex;
    gap: 2px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 22px;
    padding: 4px;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--chip-shadow);
    pointer-events: auto;
  }
  #weather button {
    width: 34px; height: 34px;
    border: none;
    background: transparent;
    border-radius: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    transition: background 0.16s ease, color 0.16s ease, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  #weather button svg { width: 18px; height: 18px; display: block; }
  #weather button .auto-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1;
  }
  #weather button:active { transform: scale(0.92); }
  #weather button.active {
    background: var(--chip-bg-hot);
    color: var(--ink);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.9) inset,
      0 1px 2px rgba(20, 30, 50, 0.05);
  }

  /* Shuffle (random layout) — sits to the left of the weather picker */
  #shuffle {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    /* Sit just left of #weather. #weather is at right:14px and is
       ~186px wide (5 × 34 + 4 × 2 gap + 4 × 2 padding); add 6px gap. */
    right: calc(14px + 186px + 6px);
    z-index: 20;
    width: 42px;
    height: 42px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 22px;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--chip-shadow);
    color: var(--ink-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.16s ease, color 0.16s ease, transform 0.08s;
    font: inherit;
  }
  #shuffle svg { width: 20px; height: 20px; display: block; }
  #shuffle:active { transform: scale(0.92); }
  #shuffle.spin svg { animation: shuffle-spin 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes shuffle-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Watermark */
  #watermark {
    position: absolute;
    left: 14px;
    bottom: max(140px, calc(env(safe-area-inset-bottom) + 140px));
    width: 56px;
    height: auto;
    opacity: 0.45;
    z-index: 18;
    pointer-events: none;
  }

  /* Toast */
  #toast {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 30;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .toast-bubble {
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--ink);
    border-radius: 16px;
    padding: 9px 16px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: var(--chip-shadow);
    animation: toast-in 0.42s cubic-bezier(.34,1.56,.64,1) both, toast-out 0.5s ease 1.4s forwards;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-12px) scale(0.92); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes toast-out {
    to { opacity: 0; transform: translateY(-8px) scale(0.96); }
  }

  /* Resume dialog */
  #resume-overlay {
    display: none;
    position: absolute; inset: 0;
    z-index: 60;
    background: rgba(20, 16, 8, 0.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
  }
  #resume-overlay.show { display: flex; }
  .resume-panel {
    width: min(86%, 300px);
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 22px;
    padding: 26px 24px 18px;
    text-align: center;
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.85) inset,
      0 24px 56px -16px rgba(40, 50, 80, 0.34);
  }
  .resume-panel .ico {
    width: 44px; height: 44px;
    margin: 0 auto 12px;
    color: var(--ink-soft);
  }
  .resume-panel .ico svg { width: 100%; height: 100%; display: block; }
  .resume-panel h2 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 750;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .resume-panel p  {
    margin: 0 0 18px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .resume-panel button {
    display: block; width: 100%; height: 42px;
    border-radius: 14px; border: none;
    font: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s, opacity 0.16s;
  }
  .resume-panel button:active { transform: scale(0.97); opacity: 0.88; }
  .resume-panel .yes {
    background: var(--ink);
    color: #fff8ed;
    margin-bottom: 8px;
    box-shadow: 0 4px 14px -4px rgba(58, 47, 30, 0.6);
  }
  .resume-panel .no {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid rgba(120, 110, 90, 0.25);
  }
</style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hint">pick a tool below, then tap a tile</div>
  <div id="weather">
    <button data-mode="auto"  aria-label="Auto"></button>
    <button data-mode="dawn"  aria-label="Dawn"></button>
    <button data-mode="day"   aria-label="Day"></button>
    <button data-mode="dusk"  aria-label="Sunset"></button>
    <button data-mode="night" aria-label="Night"></button>
  </div>

  <button id="shuffle" aria-label="Random farm layout" title="Random layout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3h5v5"/>
      <path d="M4 20L21 3"/>
      <path d="M21 16v5h-5"/>
      <path d="M15 15l6 6"/>
      <path d="M4 4l5 5"/>
    </svg>
  </button>

  <img id="watermark" src="img/aigram.svg" alt="">

  <div id="toast"></div>

  <div id="dock-wrap"><div id="dock"></div></div>

  <div id="resume-overlay">
    <div class="resume-panel">
      <div class="ico" id="resume-ico"></div>
      <h2>Welcome back to your farm</h2>
      <p id="resume-sub">Your layout is saved</p>
      <button class="yes" id="resume-yes">Continue</button>
      <button class="no" id="resume-no">Start fresh</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    // ─────────────────────────────────────────────────────────────
    // CONFIG
    // ─────────────────────────────────────────────────────────────
    const GRID = 8;
    const TILE = 1;
    const SAVE_KEY = 'tiny_farm_v3_save';
    const MAX_LEVEL = 6;

    // Single-color silhouette icons (currentColor → CSS tints per tool)
    const ICONS = {
      tree: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="10.6" y="14" width="2.8" height="8" rx="0.4"/>
        <path d="M5 11.5 a7 4.5 0 0 1 14 0 v.2 H5z"/>
        <path d="M6.5 7.8 a5.5 4 0 0 1 11 0 v.2 H6.5z"/>
        <path d="M9 4.3 a3 2.6 0 0 1 6 0 v.2 H9z"/>
      </svg>`,
      bush: `<svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 17 a6 5 0 0 1 7-5 a4.5 4 0 0 1 8 1 a4 4 0 0 1 3 4 z"/>
        <ellipse cx="12" cy="20" rx="10" ry="1.6" opacity="0.35"/>
      </svg>`,
      flower: `<svg viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="12" cy="17" rx="9" ry="3.2"/>
        <circle cx="6.8" cy="10.5" r="2.4"/>
        <circle cx="12" cy="8" r="2.6"/>
        <circle cx="17.2" cy="10.5" r="2.4"/>
        <circle cx="12" cy="9" r="1.1" fill="rgba(255,255,255,0.55)"/>
      </svg>`,
      wheat: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="11.4" y="11" width="1.2" height="11" rx="0.3"/>
        <ellipse cx="12" cy="5" rx="2.4" ry="3.4"/>
        <ellipse cx="7.5" cy="9" rx="2.4" ry="3.2"/>
        <ellipse cx="16.5" cy="9" rx="2.4" ry="3.2"/>
        <ellipse cx="7.5" cy="14" rx="2.4" ry="3.2"/>
        <ellipse cx="16.5" cy="14" rx="2.4" ry="3.2"/>
      </svg>`,
      sunflower: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="11.4" y="13" width="1.2" height="9" rx="0.3"/>
        <circle cx="12" cy="9" r="5"/>
        <circle cx="12" cy="9" r="2.6" fill="rgba(255,255,255,0.35)"/>
        <ellipse cx="6.5" cy="16" rx="2.6" ry="1.4" opacity="0.55"/>
      </svg>`,
      pumpkin: `<svg viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="6" cy="16" rx="3.5" ry="4.5"/>
        <ellipse cx="18" cy="16" rx="3.5" ry="4.5"/>
        <ellipse cx="12" cy="16" rx="8" ry="5"/>
        <rect x="11" y="6" width="2" height="5" rx="0.4"/>
        <path d="M14 8 Q18 7 19 11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>`,
      house: `<svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 12.5 L12 4 L21 12.5 V13.4 L12 5.4 L3 13.4 Z"/>
        <path d="M4.4 13 L19.6 13 V21.2 H4.4 Z"/>
        <rect x="10.5" y="14.5" width="3" height="6.7" rx="0.3" fill="rgba(255,250,238,0.5)"/>
        <rect x="6" y="14.8" width="3" height="3" rx="0.3" fill="rgba(255,250,238,0.5)"/>
        <rect x="15" y="14.8" width="3" height="3" rx="0.3" fill="rgba(255,250,238,0.5)"/>
      </svg>`,
      fence: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="13" width="18" height="1.4" rx="0.3"/>
        <rect x="3" y="17" width="18" height="1.4" rx="0.3"/>
        <path d="M5 10 L7 8 L9 10 L9 21 L5 21 Z"/>
        <path d="M11 10 L13 8 L15 10 L15 21 L11 21 Z"/>
        <path d="M17 10 L19 8 L21 10 L21 21 L17 21 Z" transform="translate(-2,0)"/>
      </svg>`,
      well: `<svg viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="12" cy="17" rx="8" ry="3.2"/>
        <ellipse cx="12" cy="14.6" rx="8" ry="3.2" fill="rgba(255,255,255,0.25)"/>
        <rect x="9" y="6" width="1.6" height="9" rx="0.3"/>
        <rect x="13.4" y="6" width="1.6" height="9" rx="0.3"/>
        <path d="M7 5.5 L12 2 L17 5.5 L17 7 L7 7 Z"/>
      </svg>`,
      lantern: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="11" y="14" width="2" height="8" rx="0.3"/>
        <rect x="9" y="20" width="6" height="1.4" rx="0.3"/>
        <path d="M8 6 L16 6 L17 10 L17 13 Q17 14.5 15.5 14.5 L8.5 14.5 Q7 14.5 7 13 L7 10 Z"/>
        <rect x="9" y="9" width="6" height="3.5" rx="0.3" fill="rgba(255,236,160,0.6)"/>
        <rect x="10.5" y="3" width="3" height="3" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg>`,
      water: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M3 7.5 Q7 5 12 7.5 T21 7.5"/>
        <path d="M3 12.5 Q7 10 12 12.5 T21 12.5"/>
        <path d="M3 17.5 Q7 15 12 17.5 T21 17.5"/>
      </svg>`,
      erase: `<svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="11" y="2.5" width="2.6" height="8.5" rx="0.5"/>
        <path d="M5 11 L19 11 L17 21.5 L7 21.5 Z"/>
      </svg>`,
    };

    const TOOLS = [
      { id: 'tree',      name: 'Tree' },
      { id: 'bush',      name: 'Bush' },
      { id: 'flower',    name: 'Bloom' },
      { id: 'wheat',     name: 'Wheat' },
      { id: 'sunflower', name: 'Sun' },
      { id: 'pumpkin',   name: 'Pump' },
      { id: 'house',     name: 'House' },
      { id: 'fence',     name: 'Fence' },
      { id: 'well',      name: 'Well' },
      { id: 'lantern',   name: 'Lamp' },
      { id: 'water',     name: 'Water' },
      { id: 'erase',     name: 'Remove' },
    ];

    // ─────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────
    const gs = {
      cells: {},  // 'x,z' → { kind, level, seed }
    };
    let started = false;
    let selectedTool = null;
    let tickStarted = false;
    let saveTimer = null;

    // ─────────────────────────────────────────────────────────────
    // THREE.JS
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4ede0);
    scene.fog = new THREE.Fog(0xf4ede0, 24, 46);

    // Camera — orthographic isometric, draggable yaw
    const CAM_DIST = Math.sqrt(11 * 11 + 11 * 11); // horizontal radius
    const CAM_HEIGHT = 11;
    let camYaw = Math.PI / 4; // initial 45° (looking from +x+z corner)
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
    cam.position.set(Math.sin(camYaw) * CAM_DIST, CAM_HEIGHT, Math.cos(camYaw) * CAM_DIST);
    cam.lookAt(0, 0, 0);

    // Lights — refs kept for TOD modulation
    const ambient = new THREE.AmbientLight(0xffffff, 0.18);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0xffffff, 0xb39879, 0.42);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.25);
    sun.position.set(8, 11, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -12;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 1.4;
    scene.add(sun);

    // ─────────────────────────────────────────────────────────────
    // TIME-OF-DAY (auto cycle)
    // ─────────────────────────────────────────────────────────────
    // Start every session at golden-hour dusk (7:30PM)
    let todMinutes = 1170;
    const TOD_CYCLE_MS = 90000; // 1.5 real minutes = 24 game hours
    let lastTodAdvance = performance.now();

    const TOD_ANCHORS = [
      { t:    0, sunI: 0.18, hemiI: 0.30, sunC: 0x6f8acf, hemiSky: 0x2a3c70, hemiGnd: 0x161a26, ambI: 0.34, bg: 0x0c1226 },
      { t:  300, sunI: 0.22, hemiI: 0.32, sunC: 0x7a8fcc, hemiSky: 0x3c4a78, hemiGnd: 0x222536, ambI: 0.32, bg: 0x162244 },
      { t:  420, sunI: 0.85, hemiI: 0.45, sunC: 0xffc794, hemiSky: 0xffd9a6, hemiGnd: 0x6f4b2a, ambI: 0.22, bg: 0xf2c2a0 },
      { t:  600, sunI: 1.15, hemiI: 0.44, sunC: 0xfff6dc, hemiSky: 0xfff0d2, hemiGnd: 0xb39879, ambI: 0.18, bg: 0xf4ede0 },
      { t:  780, sunI: 1.25, hemiI: 0.42, sunC: 0xffffff, hemiSky: 0xffffff, hemiGnd: 0xb39879, ambI: 0.18, bg: 0xddeefc },
      { t:  960, sunI: 1.15, hemiI: 0.42, sunC: 0xfff0dc, hemiSky: 0xfde9c4, hemiGnd: 0xa68460, ambI: 0.20, bg: 0xf4ede0 },
      { t: 1080, sunI: 0.95, hemiI: 0.42, sunC: 0xffaa70, hemiSky: 0xffb088, hemiGnd: 0x8a5a32, ambI: 0.22, bg: 0xe4956a },
      { t: 1170, sunI: 0.70, hemiI: 0.40, sunC: 0xff8050, hemiSky: 0xff7a60, hemiGnd: 0x6f4b2a, ambI: 0.26, bg: 0xd9784a },
      { t: 1260, sunI: 0.38, hemiI: 0.34, sunC: 0xa078c0, hemiSky: 0x6a5598, hemiGnd: 0x2f2638, ambI: 0.30, bg: 0x563e6a },
      { t: 1380, sunI: 0.22, hemiI: 0.32, sunC: 0x7a8fcc, hemiSky: 0x3c4a78, hemiGnd: 0x222536, ambI: 0.32, bg: 0x162244 },
      { t: 1440, sunI: 0.18, hemiI: 0.30, sunC: 0x6f8acf, hemiSky: 0x2a3c70, hemiGnd: 0x161a26, ambI: 0.34, bg: 0x0c1226 },
    ];

    function lerpHex(a, b, t) {
      const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
      const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
      return ((ar + (br - ar) * t) | 0) << 16 |
             ((ag + (bg - ag) * t) | 0) << 8 |
             ((ab + (bb - ab) * t) | 0);
    }

    function todProfile(min) {
      for (let i = 0; i < TOD_ANCHORS.length - 1; i++) {
        const a = TOD_ANCHORS[i], b = TOD_ANCHORS[i + 1];
        if (min >= a.t && min <= b.t) {
          const tt = (min - a.t) / Math.max(1, b.t - a.t);
          return {
            sunI:  a.sunI  + (b.sunI  - a.sunI)  * tt,
            hemiI: a.hemiI + (b.hemiI - a.hemiI) * tt,
            ambI:  a.ambI  + (b.ambI  - a.ambI)  * tt,
            sunC:  lerpHex(a.sunC,  b.sunC,  tt),
            hemiSky: lerpHex(a.hemiSky, b.hemiSky, tt),
            hemiGnd: lerpHex(a.hemiGnd, b.hemiGnd, tt),
            bg:    lerpHex(a.bg,    b.bg,    tt),
          };
        }
      }
      return TOD_ANCHORS[0];
    }

    function applyTod() {
      const p = todProfile(todMinutes);
      sun.intensity = p.sunI;
      sun.color.setHex(p.sunC);
      hemi.intensity = p.hemiI;
      hemi.color.setHex(p.hemiSky);
      hemi.groundColor.setHex(p.hemiGnd);
      ambient.intensity = p.ambI;
      scene.background.setHex(p.bg);
      scene.fog.color.setHex(p.bg);
      // Lanterns glow brighter at night
      // (try/catch — M is `const`, initial call happens before its declaration)
      try {
        if (M.lampGlass) {
          M.lampGlass.emissiveIntensity = 0.25 + (1 - Math.min(1, p.sunI)) * 1.2;
        }
      } catch {}
      // UI chrome adapts to TOD: stays legible on dark sky
      const darkness = 1 - Math.min(1, p.sunI / 1.0);          // 0 day → 1 night
      const chipBgAlpha     = 0.72 + darkness * 0.22;          // 0.72 → 0.94
      const chipBgHotAlpha  = 0.92 + darkness * 0.06;          // 0.92 → 0.98
      const chipBorderAlpha = 0.55 + darkness * 0.30;          // 0.55 → 0.85
      // Tint subtly warmer in daylight, neutral white at night for max contrast
      const wb = Math.round(245 + darkness * 10);   // warm-cream → near-white
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--chip-bg',      `rgba(255, 252, ${wb}, ${chipBgAlpha.toFixed(2)})`);
      rootStyle.setProperty('--chip-bg-hot',  `rgba(255, 255, 255, ${chipBgHotAlpha.toFixed(2)})`);
      rootStyle.setProperty('--chip-border',  `rgba(255, 255, 255, ${chipBorderAlpha.toFixed(2)})`);
    }
    applyTod();

    // ─────────────────────────────────────────────────────────────
    // WEATHER PICKER (manual TOD override)
    // ─────────────────────────────────────────────────────────────
    const WEATHER_ICONS = {
      auto:  '<span class="auto-label">AUTO</span>',
      dawn:  '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="14" r="4"/><path d="M3 18 L21 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 7 L12 4 M6 9 L5 8 M18 9 L19 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
      day:   '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.4"/><path d="M12 3 L12 5 M12 19 L12 21 M3 12 L5 12 M19 12 L21 12 M5.6 5.6 L7 7 M17 17 L18.4 18.4 M5.6 18.4 L7 17 M17 7 L18.4 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
      dusk:  '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="15" r="3.6"/><path d="M3 19 L21 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M9 8 L12 4 L15 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
      night: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 13.5 A8 8 0 1 1 11.5 4 a6 6 0 0 0 8.5 9.5 z"/></svg>',
    };
    const TOD_PRESETS = { dawn: 420, day: 780, dusk: 1170, night: 1380 };

    let weatherMode = 'auto';
    function setWeather(mode) {
      weatherMode = mode;
      if (mode !== 'auto' && TOD_PRESETS[mode] !== undefined) {
        todMinutes = TOD_PRESETS[mode];
        applyTod();
      }
      document.querySelectorAll('#weather button').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
    }
    // Populate icons + wire up tap handlers
    document.querySelectorAll('#weather button').forEach(b => {
      b.innerHTML = WEATHER_ICONS[b.dataset.mode] || '';
      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        kickStart();
        setWeather(b.dataset.mode);
      });
    });
    setWeather('auto');

    // ─────────────────────────────────────────────────────────────
    // CLOUDS (low-poly, drifting, cast shadows on the island)
    // ─────────────────────────────────────────────────────────────
    const cloudGroup = new THREE.Group();
    scene.add(cloudGroup);
    const clouds = [];
    const CLOUD_COUNT = 7;
    const CLOUD_HEIGHT = 7.2;
    const CLOUD_RANGE = 14;

    function makeCloud() {
      const g = new THREE.Group();
      const puffs = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < puffs; i++) {
        const r = 0.45 + Math.random() * 0.55;
        const mat = new THREE.MeshLambertMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.72 + Math.random() * 0.18,
          depthWrite: false,
        });
        // customDepthMaterial trick so transparent puffs still cast shadow
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), mat);
        m.position.set(
          (Math.random() - 0.5) * 3.6,
          Math.random() * 0.6,
          (Math.random() - 0.5) * 2.0
        );
        m.castShadow = true;
        m.receiveShadow = false;
        m.customDepthMaterial = new THREE.MeshDepthMaterial({
          depthPacking: THREE.RGBADepthPacking,
          alphaTest: 0.35,
          opacity: mat.opacity,
        });
        g.add(m);
      }
      g.scale.y = 0.5;
      g.userData.driftSpeed = 0.18 + Math.random() * 0.22; // units per second
      return g;
    }

    for (let i = 0; i < CLOUD_COUNT; i++) {
      const c = makeCloud();
      c.position.set(
        (Math.random() - 0.5) * CLOUD_RANGE * 2,
        CLOUD_HEIGHT + (Math.random() - 0.5) * 1.4,
        (Math.random() - 0.5) * CLOUD_RANGE
      );
      cloudGroup.add(c);
      clouds.push(c);
    }

    // ─────────────────────────────────────────────────────────────
    // GEOMETRY HELPERS
    // ─────────────────────────────────────────────────────────────
    const geomCache = new Map();
    function roundedBox(w, h, d, r = 0.05) {
      const key = `${w}|${h}|${d}|${r}`;
      const cached = geomCache.get(key);
      if (cached) return cached;
      const shape = new THREE.Shape();
      const hw = w / 2, hd = d / 2;
      const rr = Math.min(r, hw - 0.001, hd - 0.001);
      shape.moveTo(-hw + rr, -hd);
      shape.lineTo(hw - rr, -hd);
      shape.quadraticCurveTo(hw, -hd, hw, -hd + rr);
      shape.lineTo(hw, hd - rr);
      shape.quadraticCurveTo(hw, hd, hw - rr, hd);
      shape.lineTo(-hw + rr, hd);
      shape.quadraticCurveTo(-hw, hd, -hw, hd - rr);
      shape.lineTo(-hw, -hd + rr);
      shape.quadraticCurveTo(-hw, -hd, -hw + rr, -hd);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: h,
        bevelEnabled: true,
        bevelSegments: 1,
        bevelSize: 0.02,
        bevelThickness: 0.02,
        curveSegments: 3,
      });
      geo.rotateX(-Math.PI / 2);
      geo.userData.cached = true;
      geomCache.set(key, geo);
      return geo;
    }

    function castReceive(obj) {
      obj.traverse(c => {
        if (c.isMesh) {
          c.castShadow = true;
          c.receiveShadow = true;
        }
      });
      return obj;
    }

    function srand(seed) {
      let s = (seed | 0) || 1;
      return () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 0) % 1e5) / 1e5; };
    }

    function disposeGroup(g) {
      g.traverse(o => { if (o.geometry && !o.geometry.userData?.cached) o.geometry.dispose(); });
    }

    // ─────────────────────────────────────────────────────────────
    // MATERIALS (original palette)
    // ─────────────────────────────────────────────────────────────
    const M = {
      grassTop:  new THREE.MeshLambertMaterial({ color: 0xb0d949 }),
      grassEdge: new THREE.MeshLambertMaterial({ color: 0x95c138 }),
      dirt:      new THREE.MeshLambertMaterial({ color: 0x7d4519 }),
      dirtRich:  new THREE.MeshLambertMaterial({ color: 0x462b15 }),

      water:     new THREE.MeshLambertMaterial({ color: 0x3a8fcc }),
      waterDk:   new THREE.MeshLambertMaterial({ color: 0x2f77ad }),
      waterDeep: new THREE.MeshLambertMaterial({ color: 0x1d4f7e }),
      waterFoam: new THREE.MeshLambertMaterial({ color: 0xbbe9ff, transparent: true, opacity: 0.74 }),

      trunk:     new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
      leaves:    new THREE.MeshLambertMaterial({ color: 0x86d139 }),
      leavesDk:  new THREE.MeshLambertMaterial({ color: 0x5fab26 }),

      wallCream: new THREE.MeshLambertMaterial({ color: 0xf2dfb0 }),
      wallTrim:  new THREE.MeshLambertMaterial({ color: 0xe5cf99 }),
      roofRed:   new THREE.MeshLambertMaterial({ color: 0xc25b3a }),
      roofRedD:  new THREE.MeshLambertMaterial({ color: 0x8f3a20 }),
      roofBlue:  new THREE.MeshLambertMaterial({ color: 0x2a6dd1 }),
      roofBlueD: new THREE.MeshLambertMaterial({ color: 0x1d4d9c }),
      door:      new THREE.MeshLambertMaterial({ color: 0x7a4a2e }),
      windowB:   new THREE.MeshLambertMaterial({ color: 0x2a6dd1 }),
      chimney:   new THREE.MeshLambertMaterial({ color: 0xc9c4ba }),
      step:      new THREE.MeshLambertMaterial({ color: 0xa9a49a }),
      knob:      new THREE.MeshLambertMaterial({ color: 0xe8c050 }),

      bushGreen: new THREE.MeshLambertMaterial({ color: 0x5fab26 }),
      bushDk:    new THREE.MeshLambertMaterial({ color: 0x4a8f1f }),
      wheatStalk:new THREE.MeshLambertMaterial({ color: 0xb09640 }),
      wheatHead: new THREE.MeshLambertMaterial({ color: 0xe6c44a }),
      cornStalk: new THREE.MeshLambertMaterial({ color: 0x5b8e2e }),
      sunPetal:  new THREE.MeshLambertMaterial({ color: 0xf2b830 }),
      sunCore:   new THREE.MeshLambertMaterial({ color: 0x5a3a1a }),
      pumpkin:   new THREE.MeshLambertMaterial({ color: 0xd86c2a }),
      fenceWood: new THREE.MeshLambertMaterial({ color: 0xb38255 }),
      fenceWoodD:new THREE.MeshLambertMaterial({ color: 0x7d5630 }),
      stone:     new THREE.MeshLambertMaterial({ color: 0x9b9a8f }),
      lampGlass: new THREE.MeshLambertMaterial({ color: 0xffe9a8, emissive: 0xffaa33, emissiveIntensity: 0.55 }),
      petalA:    new THREE.MeshLambertMaterial({ color: 0xff7c9e }),
      petalB:    new THREE.MeshLambertMaterial({ color: 0xffd84a }),
      petalC:    new THREE.MeshLambertMaterial({ color: 0x9b6cf3 }),
      petalD:    new THREE.MeshLambertMaterial({ color: 0xffffff }),

      cowWhite:  new THREE.MeshLambertMaterial({ color: 0xfafafa }),
      cowSpot:   new THREE.MeshLambertMaterial({ color: 0x2a2620 }),
      cowMuzzle: new THREE.MeshLambertMaterial({ color: 0xf4c3c0 }),
      hoof:      new THREE.MeshLambertMaterial({ color: 0x2a2620 }),
      sheepWool: new THREE.MeshLambertMaterial({ color: 0xf2eee3 }),
      sheepFace: new THREE.MeshLambertMaterial({ color: 0x3a2d22 }),
      chickenBody: new THREE.MeshLambertMaterial({ color: 0xfefaf0 }),
      chickenComb: new THREE.MeshLambertMaterial({ color: 0xd84030 }),
      chickenBeak: new THREE.MeshLambertMaterial({ color: 0xe6a82a }),

      smoke:     new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }),
    };

    // ─────────────────────────────────────────────────────────────
    // GRID / CELLS
    // ─────────────────────────────────────────────────────────────
    const cellMeshes = {};
    const tileMeshes = [];
    const HOMESTEAD = { x: 3, z: 4 };

    function cellKey(x, z) { return x + ',' + z; }
    function worldX(x) { return (x - (GRID - 1) / 2) * TILE; }
    function worldZ(z) { return (z - (GRID - 1) / 2) * TILE; }

    function makeTuft(seedX, seedZ) {
      const rng = srand(seedX * 71 + seedZ * 13 + 3);
      const g = new THREE.Group();
      const blades = 2 + Math.floor(rng() * 3);
      for (let i = 0; i < blades; i++) {
        const h = 0.07 + rng() * 0.09;
        const blade = new THREE.Mesh(roundedBox(0.05, h, 0.05, 0.018), M.leavesDk);
        blade.position.set((rng() - 0.5) * 0.42, h / 2, (rng() - 0.5) * 0.42);
        blade.rotation.y = rng() * Math.PI;
        blade.castShadow = true;
        g.add(blade);
      }
      g.userData.swayPhase = rng() * Math.PI * 2;
      g.userData.swayAmount = 0.04;
      return g;
    }

    function buildTile(x, z) {
      const group = new THREE.Group();
      const tileGeom = new THREE.BoxGeometry(TILE * 0.98, 0.36, TILE * 0.98);
      const mats = [
        M.grassEdge, M.grassEdge,   // +x, -x
        M.grassTop,                  // +y
        M.dirt,                      // -y
        M.grassEdge, M.grassEdge,   // +z, -z
      ];
      const tile = new THREE.Mesh(tileGeom, mats);
      tile.position.y = 0.18;
      tile.userData = { isTile: true, x, z };
      tile.receiveShadow = true;
      group.add(tile);
      group.position.set(worldX(x), 0, worldZ(z));
      tileMeshes.push(tile);

      let decoration = null;
      const r = srand(x * 31 + z * 7 + 11);
      if (!(x === HOMESTEAD.x && z === HOMESTEAD.z) && r() < 0.45) {
        decoration = makeTuft(x, z);
        decoration.position.y = 0.36;
        group.add(decoration);
      }
      return { group, tile, sprite: null, decoration };
    }

    for (let x = 0; x < GRID; x++) {
      for (let z = 0; z < GRID; z++) {
        const c = buildTile(x, z);
        scene.add(c.group);
        cellMeshes[cellKey(x, z)] = c;
      }
    }

    // ─────────────────────────────────────────────────────────────
    // SPRITE FACTORIES (original style — all rounded boxes)
    // ─────────────────────────────────────────────────────────────

    function makeTree(level = 1) {
      const L = Math.max(1, Math.min(MAX_LEVEL, level));
      const g = new THREE.Group();
      const trunkH = 0.48 + (L - 1) * 0.1;
      const trunkW = 0.18 + (L - 1) * 0.018;
      const trunk = new THREE.Mesh(new THREE.BoxGeometry(trunkW, trunkH, trunkW), M.trunk);
      trunk.position.y = trunkH / 2;
      g.add(trunk);

      const lowerW = 0.62 + (L - 1) * 0.06;
      const lowerH = 0.42 + (L - 1) * 0.04;
      const lower = new THREE.Mesh(roundedBox(lowerW, lowerH, lowerW, 0.09), M.leavesDk);
      const lowerY = trunkH + lowerH * 0.5 - 0.08;
      lower.position.y = lowerY;
      g.add(lower);

      const upperW = 0.44 + (L - 1) * 0.04;
      const upperH = 0.34 + (L - 1) * 0.03;
      const upper = new THREE.Mesh(roundedBox(upperW, upperH, upperW, 0.07), M.leaves);
      const upperY = lowerY + lowerH * 0.5 + upperH * 0.5 - 0.06;
      upper.position.y = upperY;
      g.add(upper);

      if (L >= 3) {
        const crown = new THREE.Mesh(roundedBox(0.30, 0.26, 0.30, 0.06), M.leavesDk);
        crown.position.y = upperY + upperH * 0.5 + 0.12;
        g.add(crown);
      } else {
        const tip = new THREE.Mesh(roundedBox(0.22, 0.18, 0.22, 0.05), M.leaves);
        tip.position.y = upperY + upperH * 0.5 + 0.08;
        g.add(tip);
      }
      g.userData = { kind: 'tree', swayPhase: Math.random() * Math.PI * 2, swayAmount: 0.025 };
      castReceive(g);
      return g;
    }

    function makeFlowerPatch(seed, level = 1) {
      const rng = srand((seed || 0) * 17 + 23 + level * 7);
      const g = new THREE.Group();
      const bushW = 0.42;
      const bushH = 0.18;
      const bush = new THREE.Mesh(roundedBox(bushW, bushH, bushW, 0.07), M.bushGreen);
      bush.position.y = bushH / 2;
      g.add(bush);
      const bush2 = new THREE.Mesh(roundedBox(bushW * 0.7, bushH * 0.8, bushW * 0.7, 0.06), M.bushDk);
      bush2.position.set((rng() - 0.5) * 0.12, bushH * 0.6, (rng() - 0.5) * 0.12);
      g.add(bush2);
      const petals = [M.petalA, M.petalB, M.petalC, M.petalD];
      // More heads per level (4 → 8 → 12)
      const count = 4 + (level - 1) * 4;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + rng() * 0.4;
        const r = 0.10 + rng() * 0.10 + (level - 1) * 0.02;
        const headSize = 0.085 - (level - 1) * 0.008; // slightly smaller when denser
        const head = new THREE.Mesh(
          roundedBox(headSize, 0.055, headSize, 0.025),
          petals[Math.floor(rng() * petals.length)]
        );
        head.position.set(Math.cos(a) * r, bushH + 0.04 + rng() * 0.04, Math.sin(a) * r);
        g.add(head);
        const pin = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.05, 0.022), M.bushDk);
        pin.position.set(Math.cos(a) * r, bushH + 0.02, Math.sin(a) * r);
        g.add(pin);
      }
      g.userData = { kind: 'flower', swayPhase: Math.random() * Math.PI * 2, swayAmount: 0.04 };
      castReceive(g);
      return g;
    }

    function makeHouse(level = 1, seed) {
      // Deterministic palette: even seed → red, odd → blue
      const pal = (seed != null) ? ((seed % 2 === 0) ? 'red' : 'blue')
                                  : (Math.random() < 0.5 ? 'red' : 'blue');
      const roof = pal === 'red' ? M.roofRed : M.roofBlue;
      const roofD = pal === 'red' ? M.roofRedD : M.roofBlueD;
      const L = Math.max(1, Math.min(MAX_LEVEL, level));
      const g = new THREE.Group();
      const wallW = 0.68;
      const wallD = 0.56;
      const wallH = 0.48 + (L - 1) * 0.16;

      const walls = new THREE.Mesh(roundedBox(wallW, wallH, wallD, 0.04), M.wallCream);
      g.add(walls);

      // wall trim band
      const trim = new THREE.Mesh(new THREE.BoxGeometry(wallW + 0.02, 0.04, wallD + 0.02), M.wallTrim);
      trim.position.y = wallH * 0.3;
      g.add(trim);

      // hipped pyramid roof made from 2 stacked rotated boxes (looks chunkier than cone)
      const roofGroup = new THREE.Group();
      const roofBase = new THREE.Mesh(new THREE.BoxGeometry(wallW + 0.08, 0.16, wallD + 0.08), roof);
      roofBase.position.y = wallH + 0.08;
      roofGroup.add(roofBase);
      const roofMid = new THREE.Mesh(new THREE.BoxGeometry(wallW * 0.7, 0.12, wallD * 0.7), roof);
      roofMid.position.y = wallH + 0.22;
      roofGroup.add(roofMid);
      const roofTop = new THREE.Mesh(new THREE.BoxGeometry(wallW * 0.35, 0.1, wallD * 0.35), roof);
      roofTop.position.y = wallH + 0.32;
      roofGroup.add(roofTop);
      // eave trim
      const eave = new THREE.Mesh(new THREE.BoxGeometry(wallW + 0.12, 0.04, wallD + 0.12), roofD);
      eave.position.y = wallH + 0.02;
      g.add(eave);
      g.add(roofGroup);

      // door
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.28, 0.04), M.door);
      door.position.set(0, 0.14, wallD / 2 + 0.025);
      g.add(door);
      const knob = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.03), M.knob);
      knob.position.set(0.06, 0.16, wallD / 2 + 0.05);
      g.add(knob);
      const step = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.08), M.step);
      step.position.set(0, 0.02, wallD / 2 + 0.075);
      g.add(step);

      // windows
      const winY = wallH * 0.6;
      const winGeo = new THREE.BoxGeometry(0.18, 0.16, 0.04);
      const winL = new THREE.Mesh(winGeo, M.windowB);
      winL.position.set(-(wallW / 2 - 0.16), winY, wallD / 2 + 0.025);
      g.add(winL);
      const winR = new THREE.Mesh(winGeo, M.windowB);
      winR.position.set(wallW / 2 - 0.16, winY, wallD / 2 + 0.025);
      g.add(winR);
      // window crosses (cream stripes)
      [-1, 1].forEach(sgn => {
        const vbar = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.16, 0.05), M.wallCream);
        vbar.position.set(sgn * (wallW / 2 - 0.16), winY, wallD / 2 + 0.035);
        g.add(vbar);
        const hbar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.022, 0.05), M.wallCream);
        hbar.position.set(sgn * (wallW / 2 - 0.16), winY, wallD / 2 + 0.035);
        g.add(hbar);
      });

      // chimney
      const chim = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.22, 0.1), M.chimney);
      const chimX = -wallW * 0.28;
      const chimZ = -wallD * 0.2;
      chim.position.set(chimX, wallH + 0.22, chimZ);
      g.add(chim);

      // smoke puffs (bounded loop, only on homestead + level 2+ houses)
      const smokes = [];
      const wantsSmoke = (level >= 1);
      if (wantsSmoke) {
        for (let i = 0; i < 3; i++) {
          const puff = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.10, 0.12), M.smoke.clone());
          puff.userData.t0 = i / 3;
          puff.position.set(chimX, wallH + 0.33, chimZ);
          g.add(puff);
          smokes.push(puff);
        }
      }

      g.userData = {
        kind: 'house',
        palette: pal,
        smokes,
        chimney: { x: chimX, y: wallH + 0.33, z: chimZ },
      };
      castReceive(g);
      return g;
    }

    function makeBush(seed, level = 1) {

        m.position.set(s.dx, s.h / 2, s.dz);

      // Extra clusters per level (denser, taller mound)
      const extras = (level - 1) * 3;

    function makeSunflower(level = 1) {
      const g = new THREE.Group();

      const count = 1 + level;
      for (let i = 0; i < count; i++) {

    function makeFence(level = 1) {
      // level 1: horizontal rail (across +x/-x)
      // level 2: vertical rail (across +z/-z) — rotate 90°
      // level 3: L corner (two sides)
      // level 4: full square ring (four sides)
      const g = new THREE.Group();
      const postW = 0.07, postH = 0.32;
      function addRailSegment(rotY) {
        const seg = new THREE.Group();
        const positions = [-0.4, 0, 0.4];
        for (const x of positions) {
          const post = new THREE.Mesh(roundedBox(postW, postH, postW, 0.02), M.fenceWood);
          post.position.set(x, postH / 2, 0.42);
          seg.add(post);
          const cap = new THREE.Mesh(roundedBox(postW * 1.3, 0.05, postW * 1.3, 0.015), M.fenceWoodD);
          cap.position.set(x, postH + 0.02, 0.42);
          seg.add(cap);
        }
        const topRail = new THREE.Mesh(roundedBox(0.86, 0.05, 0.06, 0.015), M.fenceWood);
        topRail.position.set(0, 0.26, 0.42);
        seg.add(topRail);
        const midRail = new THREE.Mesh(roundedBox(0.86, 0.05, 0.06, 0.015), M.fenceWoodD);
        midRail.position.set(0, 0.14, 0.42);
        seg.add(midRail);
        seg.rotation.y = rotY;
        return seg;
      }
      if (level === 1)      g.add(addRailSegment(-Math.PI / 2)); // along +x (south edge)
      else if (level === 2) g.add(addRailSegment(0));            // along +z (east edge)
      else if (level === 3) { // L: south + east
        g.add(addRailSegment(-Math.PI / 2));
        g.add(addRailSegment(0));
      } else {                // full ring
        g.add(addRailSegment(-Math.PI / 2));
        g.add(addRailSegment(0));
        g.add(addRailSegment(Math.PI / 2));
        g.add(addRailSegment(Math.PI));
      }
      g.userData = { kind: 'fence' };
      castReceive(g);
      return g;
    }

    function makeSprite(kind, level, seed) {
      level = level || 1;
      if (kind === 'tree')      return makeTree(level);
      if (kind === 'bush')      return makeBush(seed, level);
      if (kind === 'flower')    return makeFlowerPatch(seed, level);
      if (kind === 'wheat')     return makeWheat(level);
      if (kind === 'sunflower') return makeSunflower(level);
      if (kind === 'pumpkin')   return makePumpkin(level);
      if (kind === 'house')     return makeHouse(level, seed);
      if (kind === 'fence')     return makeFence(level);
      if (kind === 'well')      return makeWell(level);
      if (kind === 'lantern')   return makeLantern(level);
      if (kind === 'water')     return makeWaterCap(level);
      return new THREE.Group();
    }

    // ─────────────────────────────────────────────────────────────
    // INITIAL CENTERPIECE (a regular house cell — fully editable)
    // ─────────────────────────────────────────────────────────────
    function placeInitialHomestead() {
      const seed = 13; // fixed seed → consistent red-roof palette on first load
      gs.cells[cellKey(HOMESTEAD.x, HOMESTEAD.z)] = { kind: 'house', level: 3, seed };
      setSprite(HOMESTEAD.x, HOMESTEAD.z, makeSprite('house', 3, seed));
    }

    // ─────────────────────────────────────────────────────────────
    // CELL OPERATIONS
    // ─────────────────────────────────────────────────────────────
    function getCell(x, z) { return gs.cells[cellKey(x, z)]; }

    function setSprite(x, z, group) {
      const cm = cellMeshes[cellKey(x, z)];
      if (cm.sprite) {
        cm.group.remove(cm.sprite);
        disposeGroup(cm.sprite);
      }
      cm.sprite = group;
      if (group) {
        group.position.y = 0.36;
        cm.group.add(group);
        group.userData.dropFrom = 1.2;
        group.userData.dropAt = performance.now();
        if (cm.decoration) cm.decoration.visible = false;
      } else {
        if (cm.decoration) cm.decoration.visible = true;
      }
    }

    // Each tool's max level — re-tap same cell cycles 1 → max → 1 again
    const LEVEL_MAX = {
      tree: 6, house: 6,
      bush: 3, flower: 3, wheat: 3, sunflower: 3, pumpkin: 3,
      fence: 4, well: 2, lantern: 2, water: 2,
    };

    function placeAt(x, z, kind, opts) {
      opts = opts || {};
      const existing = getCell(x, z);
      // Same kind → cycle through levels (1 → max → 1)
      if (existing && existing.kind === kind) {
        const max = LEVEL_MAX[kind] || 1;
        if (existing.level >= max) {
          existing.level = 1;
          existing.seed = Math.floor(Math.random() * 1e6);
        } else {
          existing.level += 1;
        }
        setSprite(x, z, makeSprite(kind, existing.level, existing.seed));
        if (!opts.silent) playSfx('place');
        if (!opts.skipSave) saveSoon();
        return true;
      }
      // Different kind → replace
      const seed = Math.floor(Math.random() * 1e6);
      gs.cells[cellKey(x, z)] = { kind, level: 1, seed };
      setSprite(x, z, makeSprite(kind, 1, seed));
      if (!opts.silent) playSfx('place');
      if (!opts.skipSave) saveSoon();
      return true;
    }

    function eraseAt(x, z, opts) {
      opts = opts || {};
      const c = getCell(x, z);
      if (!c) {
        if (!opts.silent) playSfx('bonk');
        return false;
      }
      delete gs.cells[cellKey(x, z)];
      setSprite(x, z, null);
      if (!opts.silent) playSfx('place');
      if (!opts.skipSave) saveSoon();
      return true;
    }

    // ─────────────────────────────────────────────────────────────
    // AUTO-PLACE & RANDOM LAYOUT
    // ─────────────────────────────────────────────────────────────
    function neighbors(x, z) {
      const out = [];
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (const [dx, dz] of dirs) {
        const nx = x + dx, nz = z + dz;
        if (nx < 0 || nz < 0 || nx >= GRID || nz >= GRID) continue;
        out.push(getCell(nx, nz));
      }
      return out;
    }
    function countAdj(x, z, kind) {
      let n = 0;
      for (const c of neighbors(x, z)) if (c && c.kind === kind) n++;
      return n;
    }
    function countAdjAny(x, z) {
      let n = 0;
      for (const c of neighbors(x, z)) if (c) n++;
      return n;
    }

    // Score a candidate empty tile for the given kind.
    // Higher = more natural-looking spot. Top candidates are then
    // sampled with a little jitter so repeated taps stay varied.
    function scoreSpot(kind, x, z) {
      const edge = Math.min(x, z, GRID - 1 - x, GRID - 1 - z);
      const adjHouse = countAdj(x, z, 'house');
      const adjAny = countAdjAny(x, z);
      switch (kind) {
        case 'tree':
          return (edge === 0 ? 2.0 : edge === 1 ? 1.0 : 0)
            + countAdj(x, z, 'tree') * 0.4
            - adjHouse * 1.2;
        case 'bush':
          return countAdj(x, z, 'tree') * 0.6
            + countAdj(x, z, 'bush') * 0.4
            - adjHouse * 0.3;
        case 'flower':
          return 0.2 + countAdj(x, z, 'flower') * 0.5
            - adjHouse * 0.2;
        case 'wheat':
          return countAdj(x, z, 'wheat') * 0.9
            + (edge >= 1 ? 0.3 : 0);
        case 'sunflower':
          return 0.3 + countAdj(x, z, 'sunflower') * 0.6
            - countAdj(x, z, 'tree') * 0.3;
        case 'pumpkin':
          return 0.3 + countAdj(x, z, 'pumpkin') * 0.6;
        case 'house':
          return (edge >= 2 ? 1.2 : 0)
            - countAdj(x, z, 'house') * 2.0
            - adjAny * 0.15;
        case 'fence':
          return adjHouse * 1.0
            + countAdj(x, z, 'fence') * 0.6
            + countAdj(x, z, 'well') * 0.3;
        case 'well':
          return adjHouse * 0.7 + adjAny * 0.2
            - countAdj(x, z, 'well') * 2.0;
        case 'lantern':
          return adjHouse * 0.6 + countAdj(x, z, 'fence') * 0.4
            - countAdj(x, z, 'lantern') * 1.0;
        case 'water':
          return countAdj(x, z, 'water') * 0.8
            + countAdj(x, z, 'wheat') * 0.3
            - adjHouse * 0.4;
        default:
          return 0;
      }
    }

    function pickAutoSpot(kind) {
      const empty = [];
      for (let x = 0; x < GRID; x++) {
        for (let z = 0; z < GRID; z++) {
          if (!getCell(x, z)) empty.push({ x, z });
        }
      }
      if (empty.length === 0) return null;
      const scored = empty.map(p => ({
        x: p.x, z: p.z,
        s: scoreSpot(kind, p.x, p.z) + Math.random() * 0.5,
      }));
      scored.sort((a, b) => b.s - a.s);
      const top = scored.slice(0, Math.min(4, scored.length));
      return top[Math.floor(Math.random() * top.length)];
    }

    function autoPlace(kind, opts) {
      opts = opts || {};
      if (kind === 'erase') return false;
      const spot = pickAutoSpot(kind);
      if (!spot) {
        if (!opts.silent) {
          playSfx('bonk');
          showToast('Farm is full');
        }
        return false;
      }
      placeAt(spot.x, spot.z, kind, opts);
      return true;
    }

    function randomFarm() {
      // Wipe everything (including initial homestead) silently
      for (let x = 0; x < GRID; x++) {
        for (let z = 0; z < GRID; z++) {
          if (getCell(x, z)) eraseAt(x, z, { silent: true, skipSave: true });
        }
      }
      const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
      // Order matters: anchors first (houses), then accents, then
      // foliage filler. Each autoPlace re-scores against the current
      // state so later kinds naturally cluster around earlier ones.
      const plan = [
        ['house',     rnd(1, 2)],
        ['fence',     rnd(2, 4)],
        ['well',      rnd(0, 1)],
        ['lantern',   rnd(1, 2)],
        ['tree',      rnd(4, 7)],
        ['bush',      rnd(2, 4)],
        ['flower',    rnd(3, 6)],
        ['wheat',     rnd(2, 4)],
        ['sunflower', rnd(1, 2)],
        ['pumpkin',   rnd(1, 2)],
        ['water',     Math.random() < 0.45 ? 1 : 0],
      ];
      for (const [kind, count] of plan) {
        for (let i = 0; i < count; i++) {
          if (!autoPlace(kind, { silent: true, skipSave: true })) break;
        }
      }
      playSfx('place');
      saveSoon();
    }

    // ─────────────────────────────────────────────────────────────
    // INPUT (tap only — no rotation, no drag)
    // ─────────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function pickAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, cam);
      // Walk sprites first (they sit above tiles)
      const objs = [];
      for (const k in cellMeshes) {
        const cm = cellMeshes[k];
        if (cm.sprite) objs.push(cm.sprite);
      }
      if (objs.length) {
        const sHits = raycaster.intersectObjects(objs, true);
        if (sHits.length) {
          let g = sHits[0].object;
          while (g && g !== scene) {
            for (const k in cellMeshes) {
              if (cellMeshes[k].sprite === g) {
                const [x, z] = k.split(',').map(Number);
                return { x, z };
              }
            }
            g = g.parent;
          }
        }
      }
      const hits = raycaster.intersectObjects(tileMeshes);
      if (hits.length) {
        const t = hits[0].object;
        return { x: t.userData.x, z: t.userData.z };
      }
      return null;
    }

    // Tap = place, drag = rotate. 8px threshold to distinguish.
    const DRAG_THRESHOLD = 8;
    let pointerStart = null;
    let isDragging = false;

    function doTap(clientX, clientY) {
      cam.updateMatrixWorld(true);
      const hit = pickAt(clientX, clientY);
      if (!hit) return;
      hideHint();
      if (selectedTool === 'erase') { eraseAt(hit.x, hit.z); return; }
      if (selectedTool) placeAt(hit.x, hit.z, selectedTool);
    }

    function onPointerDown(e) {
      if (e.target && e.target.closest && e.target.closest('#dock-wrap')) return;
      if (e.target && e.target.closest && e.target.closest('#resume-overlay')) return;
      kickStart();
      pointerStart = { x: e.clientX, y: e.clientY, yaw0: camYaw };
      isDragging = false;
      try { canvas.setPointerCapture(e.pointerId); } catch {}
    }
    function onPointerMove(e) {
      if (!pointerStart) return;
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      if (!isDragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        isDragging = true;
        hideHint();
      }
      if (isDragging) {
        // Drag right → world rotates so right side comes toward viewer
        // (camera goes clockwise from above)
        camYaw = pointerStart.yaw0 - dx * 0.006;
      }
    }
    function onPointerUp(e) {
      if (!pointerStart) return;
      const wasDragging = isDragging;
      const sx = pointerStart.x, sy = pointerStart.y;
      pointerStart = null;
      isDragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch {}
      if (wasDragging) return;
      doTap(e.clientX || sx, e.clientY || sy);
    }
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    // ─────────────────────────────────────────────────────────────
    // DOCK
    // ─────────────────────────────────────────────────────────────
    const dockEl = document.getElementById('dock');

    function renderDock() {
      dockEl.innerHTML = '';
      for (const tool of TOOLS) {
        const div = document.createElement('div');
        div.className = 'tool';
        div.dataset.tool = tool.id;
        if (selectedTool === tool.id) div.classList.add('selected');
        const glyph = document.createElement('div');
        glyph.className = 'glyph';
        glyph.innerHTML = ICONS[tool.id] || '';
        div.appendChild(glyph);
        const lbl = document.createElement('div');
        lbl.className = 'lbl';
        lbl.textContent = tool.name;
        div.appendChild(lbl);
        div.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          kickStart();
          hideHint();
          // Erase keeps its toggle behavior — auto-erasing would be destructive.
          if (tool.id === 'erase') {
            selectedTool = (selectedTool === 'erase') ? null : 'erase';
            renderDock();
            return;
          }
          // Build tools: each tap selects the tool AND drops one item
          // on the best-looking empty tile. Manual tile tapping still works.
          selectedTool = tool.id;
          renderDock();
          autoPlace(tool.id);
        });
        dockEl.appendChild(div);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // TOAST + HINT
    // ─────────────────────────────────────────────────────────────
    function showToast(html) {
      const t = document.createElement('div');
      t.className = 'toast-bubble';
      t.innerHTML = html;
      document.getElementById('toast').appendChild(t);
      setTimeout(() => t.remove(), 1900);
    }
    function hideHint() {
      const h = document.getElementById('hint');
      if (h) h.classList.add('hide');
    }

    // ─────────────────────────────────────────────────────────────
    // WANDERING ANIMALS
    // ─────────────────────────────────────────────────────────────
    function makeCowMesh() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.26, 0.24), M.cowWhite);
      body.position.set(0, 0.22, 0);
      g.add(body);
      const spot1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, 0.12), M.cowSpot);
      spot1.position.set(0.06, 0.36, 0.06); g.add(spot1);
      const spot2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.10), M.cowSpot);
      spot2.position.set(-0.08, 0.36, -0.08); g.add(spot2);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.16), M.cowWhite);
      head.position.set(0.27, 0.30, 0); g.add(head);
      const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.10), M.cowMuzzle);
      muzzle.position.set(0.36, 0.26, 0); g.add(muzzle);
      [-0.06, 0.06].forEach(dz => {

        eye.position.set(0.34, 0.35, dz);
        g.add(eye);
      });
      [-0.09, 0.09].forEach(dz => {

        ear.position.set(0.22, 0.42, dz);
        g.add(ear);
      });
      const legs = [];
      [[0.13, -0.08], [0.13, 0.08], [-0.13, -0.08], [-0.13, 0.08]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, 0.07), M.hoof);
        leg.position.set(x, 0.08, z);

    function makeChickenMesh() {
      const g = new THREE.Group();
      // body
      const body = new THREE.Mesh(roundedBox(0.18, 0.16, 0.14, 0.04), M.chickenBody);
      body.position.set(0, 0.16, 0);
      g.add(body);

      const head = new THREE.Mesh(roundedBox(0.1, 0.1, 0.1, 0.03), M.chickenBody);
      head.position.set(0.13, 0.26, 0);

      const comb = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.07), M.chickenComb);

      [-0.04, 0.04].forEach(dz => {

      });

      const tail = new THREE.Mesh(roundedBox(0.07, 0.1, 0.05, 0.025), M.chickenBody);

      // 2 legs only
      const legs = [];
      [[0.02, -0.05], [0.02, 0.05]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.08, 0.025), M.chickenBeak);
        leg.position.set(x, 0.04, z);
